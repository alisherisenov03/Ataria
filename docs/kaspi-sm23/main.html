<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;overflow:hidden;position:relative;font-family:'Inter Display','Inter',sans-serif;color:#f5f1ea;
 background:#120d0a url(gpt1_logo.jpg) center/1200px 1200px no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,5,.55) 0%,rgba(10,7,5,0) 30%),linear-gradient(0deg,rgba(10,7,5,.75) 0%,rgba(10,7,5,0) 16%)}
.kicker{position:absolute;left:60px;top:54px;font-size:30px;font-weight:500;color:#d8cfc4;font-style:italic}
h1{position:absolute;left:56px;top:88px;font-size:112px;line-height:.92;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.sub{position:absolute;left:60px;top:205px;font-size:26px;color:#cfc6bb;font-weight:500;line-height:1.35}
.sub b{color:#ff7a2a;font-weight:700}
.badge{position:absolute;right:56px;top:58px;background:#ff6a1a;color:#fff;font-weight:900;font-size:56px;line-height:1;padding:14px 26px 16px;border-radius:24px;box-shadow:0 0 50px rgba(255,106,26,.45)}
.badge small{font-size:30px;font-weight:800}
.specs{position:absolute;left:60px;top:330px;display:flex;flex-direction:column;gap:22px}
.s b{display:block;font-size:56px;font-weight:900;letter-spacing:-.02em;line-height:1}
.s b i{font-style:normal;font-size:34px;color:#ff7a2a;margin-left:4px}
.s small{display:block;font-size:20px;color:#bdb3a7;margin-top:2px;font-weight:500}
.gift{position:absolute;left:50px;bottom:30px;width:400px;background:rgba(22,16,12,.82);border:1.5px solid rgba(255,122,42,.55);border-radius:22px;padding:18px 22px;backdrop-filter:blur(6px)}
.gift .t{font-size:24px;font-weight:900;color:#ff7a2a;letter-spacing:.02em}
.gift .d{font-size:20px;color:#e6ddd2;margin-top:4px;line-height:1.3}
.warr{position:absolute;right:50px;bottom:30px;background:rgba(22,16,12,.82);border:1.5px solid rgba(255,255,255,.18);border-radius:22px;padding:18px 24px;text-align:center}
.warr b{display:block;font-size:34px;font-weight:900}.warr small{font-size:19px;color:#bdb3a7}
</style></head><body>
<div class="shade"></div>
<div class="kicker">кухонная машина</div>
<h1>Комбайн</h1>
<div class="sub">Мясорубка · тестораскатка · лапшерезка · овощерезка · блендер<br><b>Всё для кухни в одном приборе</b></div>
<div class="badge">2000<small> Вт</small></div>
<div class="specs">
 <div class="s"><b>7<i>л</i></b><small>стальная чаша</small></div>
 <div class="s"><b>1,5<i>л</i></b><small>стеклянный блендер</small></div>
 <div class="s"><b>6<i>+P</i></b><small>скоростей</small></div>
 <div class="s"><b>15<i>мин</i></b><small>таймер, LED</small></div>
</div>
<div class="gift"><div class="t">🎁 ПОДАРОК</div><div class="d">Насадки для колбасок и кеббе</div></div>
<div class="warr"><b>12 мес.</b><small>гарантия</small></div>
</body></html>
