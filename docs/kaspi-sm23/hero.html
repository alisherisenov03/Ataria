<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brass:#d9b27a;--mute:#b0a597}
body{width:1200px;height:1200px;overflow:hidden;position:relative;font-family:Montserrat,sans-serif;color:#f4eee6;background:#100c0a url(gpt2_retouch.jpg) center/1200px 1200px no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.7) 0%,rgba(10,8,6,0) 14%),linear-gradient(0deg,rgba(10,8,6,.9) 0%,rgba(10,8,6,.4) 9%,rgba(10,8,6,0) 16%)}
.top{position:absolute;left:56px;right:56px;top:42px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:46px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
h1 span{color:var(--brass);text-transform:none}
.tag{font-size:16px;letter-spacing:.3em;color:var(--mute);font-weight:600;text-align:right}
.tag b{color:var(--brass)}
.specs{position:absolute;left:56px;right:56px;bottom:30px;display:flex}
.s{flex:1;text-align:center;border-left:1px solid rgba(217,178,122,.35)}
.s:first-child{border-left:0}
.s b{font-size:36px;font-weight:800}.s b i{font-style:normal;color:var(--brass);font-size:22px;margin-left:4px}
.s small{display:block;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-top:2px}
</style></head><body><div class="shade"></div>
<div class="top"><h1>Кухонная машина <span>2000 Вт</span></h1><div class="tag"><b>ATARIA</b><br>AT-SM23</div></div>
<div class="specs">
<div class="s"><b>7<i>л</i></b><small>стальная чаша</small></div>
<div class="s"><b>6<i>+P</i></b><small>скоростей</small></div>
<div class="s"><b>1,5<i>л</i></b><small>блендер</small></div>
<div class="s"><b>12<i>мес</i></b><small>гарантия</small></div>
</div></body></html>
