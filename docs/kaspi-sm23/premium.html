<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400&family=Montserrat:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brass:#d4ab72;--ink:#f3ede4;--mute:#a89c8e}
body{width:1200px;height:1200px;overflow:hidden;position:relative;font-family:Montserrat,sans-serif;color:var(--ink);
 background:#0f0b09 url(gpt1_retouch.jpg) center/1200px 1200px no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,7,.62) 0%,rgba(12,9,7,.25) 22%,rgba(12,9,7,0) 34%),linear-gradient(0deg,rgba(12,9,7,.85) 0%,rgba(12,9,7,0) 15%)}
.eyebrow{position:absolute;left:64px;top:64px;font-size:17px;letter-spacing:.38em;font-weight:500;color:var(--mute)}
.eyebrow b{color:var(--brass);font-weight:600}
h1{position:absolute;left:60px;top:104px;font-family:Unbounded;font-weight:200;font-size:74px;line-height:1.02;letter-spacing:-.01em}
h1 em{font-style:normal;font-weight:400;color:var(--brass)}
.lead{position:absolute;left:64px;top:282px;font-size:21px;line-height:1.5;color:#cbbfb1;font-weight:400;max-width:520px}
.rule{position:absolute;left:64px;top:270px;width:56px;height:1.5px;background:var(--brass)}
.specs{position:absolute;left:64px;right:64px;bottom:34px;display:flex}
.s{flex:1;padding-left:22px;border-left:1px solid rgba(255,255,255,.12)}
.s:first-child{padding-left:0;border-left:0}
.s b{display:block;font-family:Unbounded;font-weight:300;font-size:40px;letter-spacing:-.01em}
.s b i{font-style:normal;font-size:20px;color:var(--brass);margin-left:6px;font-weight:400}
.s small{display:block;margin-top:6px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.gift{position:absolute;right:64px;top:70px;text-align:right;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);line-height:1.6}
.gift b{display:block;color:var(--brass);font-weight:600}
</style></head><body>
<div class="shade"></div>
<div class="eyebrow"><b>ATARIA</b> &nbsp;·&nbsp; AT-SM23</div>
<h1>Кухонная<br>машина <em>2000&nbsp;Вт</em></h1>
<div class="rule"></div>
<div class="lead">Мясорубка, тестораскатка, лапшерезка,<br>овощерезка и блендер</div>
<div class="gift"><b>В подарок</b>насадки для колбасок<br>и кеббе</div>
<div class="specs">
 <div class="s"><b>7<i>л</i></b><small>стальная чаша</small></div>
 <div class="s"><b>6<i>+ P</i></b><small>скоростей</small></div>
 <div class="s"><b>1,5<i>л</i></b><small>стекл. блендер</small></div>
 <div class="s"><b>12<i>мес</i></b><small>гарантия</small></div>
</div>
</body></html>
